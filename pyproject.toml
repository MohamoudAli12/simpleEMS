[project]
name = "simpleems"
version = "0.1.0"
description = "simpleEMS is a framework built on top of openEMS to make design and simulation of antennas and other microwave structures easier"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.13"
dependencies = [
    "h5py>=3.15.1",
    "matplotlib>=3.10.8",
    "numpy>=2.4.0",
    "pyqt6>=6.10.1",
    "pysmithchart>=0.4.1",
    "pyvista>=0.46.4",
    "pyvistaqt>=0.11.3",
    "scikit-rf>=1.9.0",
    "scipy>=1.16.3",
]

[dependency-groups]
dev = [
    "numpydoc>=1.10.0",
    "sphinx>=9.1.0",
    "sphinx-rtd-theme>=3.1.0rc1",
    "tqdm>=4.67.1",
]

